l_simp_chinese:
 LOADING_TIP_0: "大河＋八级要塞很难打过去吗？\n- 自称玄武的山姆（台湾）"
 LOADING_TIP_1: "同盟的各位不要忘记切学说阿。\n- 但自己却忘记切的浪漫古士"
 LOADING_TIP_2: "欸不是，我不加阵营了，哼哼！\n- 正在哈气的傲娇醋饭"
 LOADING_TIP_3: "我前线训练被他偷袭，不然我不会败这么惨。\n- 被新手一个月二十二天速通三大城的柚子（苏联大佬）"
 LOADING_TIP_4: "对面山姆出了十四万辆蹲坑坦，我怎么打。\n- 面对超级龟壳的神圣的猫猫"
 LOADING_TIP_5: "我把兵牌换成了大象，但编制里只有两个骑兵。\n- 诈骗队友的旋转猫"
 LOADING_TIP_6: "我看前线固若金汤、牢不可破，有印度的大象跟中共的填线，就把坦克派过去了。\n- 被旋转猫诈骗的神圣的猫猫"
 LOADING_TIP_7: "我前线部队忘记发枪了。\n- 被墨西哥夺回七大洲的Ａ"
 LOADING_TIP_8: "不玩摇奖。\n- 后面还是来玩一把，但却被队友坑惨的蓝叶"
 LOADING_TIP_9: "我要把摇奖内建we shall never surrender。\n- 持续推销牢模组的ＥＭＰＴＹ"
 LOADING_TIP_10: "我玩摇奖就是来打产能爆炸的，你砍了我玩什么呢。\n- 正在辩论产能的大莫老师"
 LOADING_TIP_11: "一定是因为浪漫古士跟我同一队运气才会这么差。\n- 首都升起蘑菇云的醋饭"
 LOADING_TIP_12: "哈哈幸运Ｅ幸运Ｅ～～～\n- 听到浪漫古士总共外流２５军民的奥村"
 LOADING_TIP_13: "本来是可以打的，但我一看墨西哥有１６０％特种攻击，还怎么打。\n- 本来以为是爽局的ＹＵＷＩＥ"
 LOADING_TIP_14: "队友不就是拿来吸血的吗？\n- 被所有人不信任的ＡＫ•冯•哈布斯堡"
 LOADING_TIP_15: "我原本想说朝鲜的主体工业给２０上限会不会太多，直到看到泰国，我觉得还可以给多一点。\n- 搞出初代超强朝鲜的浪漫古士"
 LOADING_TIP_16: "一边是一己之力在轴心挑起大梁，一边在中国队友身边吃软饭，谁是真男人不用多说了吧。\n- 锐评ＡＫ与山姆单挑的小菊"