l_simp_chinese:
 DGL_german_research_name: "德意志帝国联合研究团"
 DGL_sync_german_research_tt: "成立§Y德意志帝国联合研究团§!，德国及其同阵营国家加入科技共享。\n每个已掌握目标科技的成员为其他成员研究该科技提供基础§G25%§!研究加成。\n成员每周自动同步；退出德国阵营或德国失去§Y德意志帝国研发§!后，不再享有共享加成。"
 DGL_german_research_desc: "德国拥有§Y德意志帝国研发§!时，德国及其同阵营国家可共享科技研究成果。每个已掌握目标科技的研究团成员提供基础§G25%§!研究加成。成员每周自动同步；退出德国阵营后不再享有共享加成。"
